<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 100" role="img">
  <title>Rizzo Ditalia Painting Corporation</title>

  <!-- ── Paint splatters in the 4 corners of the symbol ── -->
  <g>
    <!-- top-left: red -->
    <g fill="#cc0000" transform="translate(8.5 9) rotate(-20)">
      <path d="M0-5.2c1.6-.2 2.2 1.4 3.6 1.2 1.7-.2 2.5 1.3 1.6 2.6-.7 1 .9 2.3-.2 3.5-1 1.1-2.3.1-3.4.9-1.3.9-2.9.6-3.4-.8-.4-1.2-2.2-1.6-1.8-3.1.4-1.4 2-1.3 2.4-2.6.2-.8.4-1.6 1.2-1.7z"/>
      <circle cx="7.6" cy="3.6" r="1.5"/>
      <circle cx="3.4" cy="7.4" r="1"/>
      <circle cx="-6.6" cy="2.8" r=".9"/>
    </g>
    <!-- top-right: navy -->
    <g fill="#1a2b5e" transform="translate(91.5 9.5) rotate(35)">
      <path d="M.4-4.6c1.4.3 1.6 1.8 2.9 2.1 1.5.4 1.7 2 .6 2.9-.9.8.1 2.4-1.1 3.1-1.2.7-2.1-.5-3.3 0-1.3.5-2.6-.3-2.6-1.6 0-1.1-1.5-1.8-.9-3.1.6-1.2 2-.8 2.6-1.9.5-.9.8-1.7 1.8-1.5z"/>
      <circle cx="-6.2" cy="2.6" r="1.4"/>
      <circle cx="5.8" cy="4.4" r="1"/>
      <circle cx="-2.8" cy="6.8" r=".8"/>
    </g>
    <!-- bottom-left: green -->
    <g fill="#006400" transform="translate(9 91) rotate(160)">
      <path d="M.4-4.6c1.4.3 1.6 1.8 2.9 2.1 1.5.4 1.7 2 .6 2.9-.9.8.1 2.4-1.1 3.1-1.2.7-2.1-.5-3.3 0-1.3.5-2.6-.3-2.6-1.6 0-1.1-1.5-1.8-.9-3.1.6-1.2 2-.8 2.6-1.9.5-.9.8-1.7 1.8-1.5z"/>
      <circle cx="-6.4" cy="2.2" r="1.3"/>
      <circle cx="5.6" cy="4.8" r="1.1"/>
      <circle cx="1.2" cy="-7.4" r=".8"/>
    </g>
    <!-- bottom-right: red -->
    <g fill="#cc0000" transform="translate(91 91) rotate(110)">
      <path d="M0-5.2c1.6-.2 2.2 1.4 3.6 1.2 1.7-.2 2.5 1.3 1.6 2.6-.7 1 .9 2.3-.2 3.5-1 1.1-2.3.1-3.4.9-1.3.9-2.9.6-3.4-.8-.4-1.2-2.2-1.6-1.8-3.1.4-1.4 2-1.3 2.4-2.6.2-.8.4-1.6 1.2-1.7z"/>
      <circle cx="7.2" cy="2.4" r="1.2"/>
      <circle cx="-5.8" cy="4.6" r="1.1"/>
      <circle cx="2.6" cy="7.6" r=".8"/>
    </g>
  </g>

  <!-- ── Hexagonal symbol: two interlaced 3D cubes (red & green) ── -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Interlace ("lazo"): white strokes under a line make the line look like it passes OVER the other -->

    <!-- 1. green cube edges (inverted Y) -->
    <path d="M50 50 L50 10 M50 50 L15.36 70 M50 50 L84.64 70" stroke="#006400" stroke-width="4"/>

    <!-- 2. red cube edges (Y): pass OVER the green ones at the center -->
    <path d="M50 50 L40.5 44.5 M50 50 L59.5 44.5 M50 50 L50 61" stroke="#fff" stroke-width="7.5" stroke-linecap="butt"/>
    <path d="M50 50 L15.36 30 M50 50 L84.64 30 M50 50 L50 90" stroke="#cc0000" stroke-width="4.5"/>

    <!-- 3. inner green hexagon (small cube): passes OVER the red edges at its corners -->
    <path d="M34.4 35 L29.22 38 L29.22 44 M65.6 35 L70.78 38 L70.78 44 M44.8 71 L50 74 L55.2 71" stroke="#fff" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="miter"/>
    <polygon points="50,26 70.78,38 70.78,62 50,74 29.22,62 29.22,38" stroke="#006400" stroke-width="4"/>

    <!-- outer red hexagon (cube silhouette) -->
    <polygon points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30" stroke="#cc0000" stroke-width="5.5"/>
  </g>

  <!-- ── Wordmark ── -->
  <text class="logo-name" x="104" y="55" fill="#1a2b5e" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.8">Rizzo Ditalia</text>
  <text class="logo-sub" x="106" y="80" fill="#555" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="12.6" font-weight="700" letter-spacing="4.4" textLength="254" lengthAdjust="spacing">PAINTING CORPORATION</text>
</svg>
